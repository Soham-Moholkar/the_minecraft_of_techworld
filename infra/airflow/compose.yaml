# Merge from the repository root with compose.yaml. Trusted local development.
services:
  airflow:
    profiles: [orchestration]
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "operator:admin"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      ATLAS_PIPELINE_ENABLED: ${ATLAS_PIPELINE_ENABLED:-false}
      ATLAS_PIPELINE_API_URL: http://api:8000
      ATLAS_PIPELINE_API_TOKEN: ${ATLAS_DEV_TOKEN:-atlas-local-development-token}
      ATLAS_PIPELINE_TENANT: northstar
      PYTHONPATH: /opt/airflow/dags
    ports: ["127.0.0.1:58080:8080"]
    volumes:
      - atlas_airflow:/opt/airflow
      - ./infra/airflow/dags:/opt/airflow/dags:ro
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
volumes:
  atlas_airflow:
