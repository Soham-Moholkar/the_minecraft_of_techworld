# Optional, trusted-local standalone cluster. No control-plane ports are published.
# Shared source volume lets executors read the same fixed Parquet file as driver.
services:
  api:
    environment:
      ATLAS_USAGE_COMPUTE_ENABLED: ${ATLAS_USAGE_COMPUTE_ENABLED:-false}
      ATLAS_USAGE_COMPUTE_STORE: /var/lib/atlas-compute
    volumes:
      - atlas_compute:/var/lib/atlas-compute:ro
  spark-master:
    profiles: [compute]
    build: &spark-build
      context: .
      dockerfile: infra/spark/Dockerfile
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.master.Master, --host, spark-master]
    networks: [default, spark-internal]
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
  spark-worker:
    profiles: [compute]
    build: *spark-build
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, --cores, "2", --memory, 1g, spark://spark-master:7077]
    depends_on: [spark-master]
    networks: [spark-internal]
    volumes: [atlas_compute:/var/lib/atlas-compute]
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
  spark-usage:
    profiles: [compute]
    build: *spark-build
    hostname: spark-usage
    command: [timeout, 240s, /opt/spark/bin/spark-submit, --master, spark://spark-master:7077, --conf, spark.driver.host=spark-usage, --conf, spark.cores.max=2, --conf, spark.sql.shuffle.partitions=2, --conf, spark.executor.memory=512m, /opt/atlas/usage_job.py]
    depends_on: [spark-worker]
    networks: [default, spark-internal]
    environment:
      ATLAS_PIPELINE_ENABLED: ${ATLAS_PIPELINE_ENABLED:-false}
      ATLAS_PIPELINE_API_URL: http://api:8000
      ATLAS_PIPELINE_API_TOKEN: ${ATLAS_DEV_TOKEN:-atlas-local-development-token}
      ATLAS_PIPELINE_TENANT: northstar
    volumes: [atlas_compute:/var/lib/atlas-compute]
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
volumes:
  atlas_compute:
networks:
  spark-internal:
    internal: true
