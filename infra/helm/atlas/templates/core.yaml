{{- if ne .Release.Namespace "atlas-dev" -}}
{{- fail "Only the atlas-dev namespace is supported" -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-runtime
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
automountServiceAccountToken: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlas-data
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: atlas-budget
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  hard:
    requests.cpu: '1'
    limits.cpu: '2'
    requests.memory: 1Gi
    limits.memory: 2Gi
    requests.storage: 1Gi
    persistentvolumeclaims: '1'
    pods: '2'
    services: '2'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: atlas
        atlas.dev/tenant: northstar
        app.kubernetes.io/name: atlas-api
    spec:
      serviceAccountName: atlas-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: {{ .Values.apiImage | quote }}
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: ATLAS_DEV_TOKEN
          valueFrom:
            secretKeyRef:
              name: atlas-operator
              key: dev-token
        - name: ATLAS_DATABASE_URL
          value: sqlite:////var/lib/atlas/atlas.db
        - name: ATLAS_REPOSITORY_ROOT
          value: /workspace
        - name: ATLAS_DEPLOYMENT_REVIEW_ENABLED
          value: 'true'
        - name: ATLAS_STREAMING_STORE
          value: /var/lib/atlas/streaming.db
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /var/lib/atlas
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8000
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: *id001
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: data
        persistentVolumeClaim:
          claimName: atlas-data

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-web
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: atlas
        atlas.dev/tenant: northstar
        app.kubernetes.io/name: atlas-web
    spec:
      serviceAccountName: atlas-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: {{ .Values.webImage | quote }}
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: ATLAS_DEV_TOKEN
          valueFrom:
            secretKeyRef:
              name: atlas-operator
              key: dev-token
        - name: ATLAS_API_URL
          value: http://atlas-api:8000
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: '3000'
        - name: ATLAS_ALLOWED_ORIGINS
          value: http://localhost:3000
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/apps/web/.next/cache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet: &id001
            path: /
            port: 3000
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet: *id001
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet: *id001
          timeoutSeconds: 2
          periodSeconds: 10
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: cache
        emptyDir:
          sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: atlas-web
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-web
  ports:
  - name: http
    port: 3000
    targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-deny
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-web-egress
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atlas-web
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: atlas-api
    ports:
    - protocol: TCP
      port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-api-ingress
  labels:
    app.kubernetes.io/managed-by: atlas
    atlas.dev/tenant: northstar
  namespace: atlas-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: atlas-web
    ports:
    - protocol: TCP
      port: 8000
