# Superset initialization/admin credentials are operator-owned; no default login.
services:
  api:
    environment:
      ATLAS_SUPERSET_ENABLED: ${ATLAS_SUPERSET_ENABLED:-false}
      ATLAS_SUPERSET_API_URL: http://superset:8088
      ATLAS_SUPERSET_API_TOKEN: ${ATLAS_SUPERSET_API_TOKEN:-}
      ATLAS_SUPERSET_DASHBOARD_ID: ${ATLAS_SUPERSET_DASHBOARD_ID:-}
  superset:
    profiles: [bi]
    image: apache/superset:6.1.0
    environment:
      SUPERSET_SECRET_KEY: ${ATLAS_SUPERSET_SECRET_KEY:-}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports: ["127.0.0.1:58088:8088"]
    volumes:
      - atlas_superset_metadata:/app/superset_home
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./artifacts/usage-bi:/var/lib/atlas-bi:ro
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
volumes:
  atlas_superset_metadata:
