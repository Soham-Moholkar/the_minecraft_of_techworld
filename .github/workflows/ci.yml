name: ATLAS quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm --filter @atlas/api-node typecheck && pnpm --filter @atlas/api-node test
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e './apps/api-python[data,dev,frameworks,streaming,lakehouse]'
      - run: python scripts/audit_consistency.py
      - run: python labs/security/agent-boundaries/run.py verify
      - run: ruff check apps/api-python
      - run: mypy apps/api-python/src
      - run: pytest apps/api-python --cov=atlas_api --cov-fail-under=80
      - run: python scripts/verify_streaming.py
      - run: python labs/data-engineering/event-pipeline/run.py verify
      - run: python scripts/validate_lab.py labs/python/api-foundation/lab.json
      - run: python scripts/validate_lab.py labs/security/agent-boundaries/lab.json
      - run: python labs/data/science-quality/run.py verify
      - run: python labs/deep-learning/framework-comparison/run.py verify
      - run: python labs/deep-learning/applied-ai/run.py verify
      - run: python labs/databases/provider-benchmarks/run.py verify
      - run: python labs/security/database-boundaries/run.py verify
  databases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e './apps/api-python[data,dev]'
      - run: docker compose --profile database up -d --wait postgres mariadb mongodb redis
      - run: python labs/databases/postgresql-concurrency/run.py verify
      - run: python labs/databases/mariadb-provider/run.py verify
      - run: python labs/databases/mongodb-document-model/run.py verify
      - run: python labs/databases/redis-cache-streams/run.py verify
      - if: always()
        run: docker compose --profile database down
  streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e './apps/api-python[streaming,dev]'
      - run: docker compose --profile streaming up -d --wait kafka
      - run: python scripts/verify_kafka.py
      - if: always()
        run: docker compose --profile streaming down
  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install 'apache-airflow==3.3.2' --constraint 'https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt'
      - run: python scripts/verify_airflow_dag.py
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: python -m pip install -e './apps/api-python[compute]'
      - run: python scripts/verify_usage_spark.py
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e './apps/api-python[dev]'
      - name: Verify the official Helm archive before extraction
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - run: bash scripts/deployment-preflight.sh
      - run: pytest apps/api-python/tests/test_deployment_review.py
  infrastructure-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e './apps/api-python[dev]'
      - name: Verify official portable OpenTofu before extraction
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/opentofu/opentofu/releases/download/v1.13.0/tofu_1.13.0_linux_amd64.zip --output "$RUNNER_TEMP/tofu.zip"
          echo "ad494034a03aaa66d93fc1c2c164d01bedf21b44cfb8b616182cb69424a67672  $RUNNER_TEMP/tofu.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/atlas-tofu"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/atlas-tofu"
          echo "$RUNNER_TEMP/atlas-tofu" >> "$GITHUB_PATH"
      - run: python scripts/verify_infrastructure_plan.py
      - run: pytest apps/api-python/tests/test_infrastructure_plan.py
