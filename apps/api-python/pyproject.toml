[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS control-plane API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.24.1",
  "psycopg[binary]==3.3.4",
  "pymongo==4.17.0",
  "PyMySQL==1.2.0",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "structlog==25.5.0",
  "uvicorn[standard]==0.52.4"
]

[project.optional-dependencies]
streaming = ["confluent-kafka==2.15.1", "pyarrow==25.0.1"]
lakehouse = ["pyiceberg[sql-sqlite,pyarrow]==0.12.0", "pyarrow==25.0.1"]
compute = ["pyspark==4.2.0", "pyarrow==25.0.1"]
neural = ["torch==2.14.0"]
frameworks = ["torch==2.14.0", "tensorflow-cpu==2.21.0", "keras==3.15.1"]
data = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "polars==1.44.2",
  "scipy==1.18.1",
  "duckdb==1.5.5",
  "scikit-learn==1.9.1"
]
dev = [
  "PyYAML==6.0.3",
  "httpx2==2.12.0",
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.13.2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
