name: atlas
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
    # Keep the host port configurable and distinct from common native installs.
    # Containers continue to use postgres:5432 on the Compose network.
    ports: ["127.0.0.1:${ATLAS_POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: ["atlas_postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  mariadb:
    image: mariadb:12.3.2
    profiles: ["database"]
    environment:
      MARIADB_DATABASE: atlas_lab
      MARIADB_USER: atlas_lab
      MARIADB_PASSWORD: atlas_lab_dev_only
      MARIADB_ROOT_PASSWORD: atlas_root_dev_only
    # The optional comparison provider can coexist with a native MySQL install.
    ports: ["127.0.0.1:${ATLAS_MARIADB_HOST_PORT:-53307}:3306"]
    volumes:
      - atlas_mariadb:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.29-noble
    profiles: ["database"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: atlas_root
      MONGO_INITDB_ROOT_PASSWORD: atlas_root_dev_only
      MONGO_INITDB_DATABASE: atlas_document
    # Named volumes are required for reliable Linux MongoDB storage on Windows.
    ports: ["127.0.0.1:${ATLAS_MONGODB_HOST_PORT:-57017}:27017"]
    volumes:
      - atlas_mongodb:/data/db
      - ./infra/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --username atlas_root --password atlas_root_dev_only --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 4s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine3.23
    profiles: ["database"]
    # ACLs disable the unauthenticated default user and constrain product/lab
    # identities by both command and key prefix.
    command:
      - redis-server
      - --aclfile
      - /usr/local/etc/redis/users.acl
      - --appendonly
      - "yes"
      - --save
      - ""
    ports: ["127.0.0.1:${ATLAS_REDIS_HOST_PORT:-56379}:6379"]
    volumes:
      - atlas_redis:/data
      - ./infra/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user atlas_cache -a atlas_cache_dev_only --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["streaming"]
    # Local-only PLAINTEXT exercise. Shared deployments need TLS/SASL/ACLs.
    ports: ["127.0.0.1:${ATLAS_KAFKA_HOST_PORT:-59092}:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${ATLAS_KAFKA_HOST_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 67108864
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_MESSAGE_MAX_BYTES: 65536
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
    volumes: ["atlas_kafka:/var/lib/kafka/data"]
    mem_limit: 1g
    cpus: 1
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: .
      dockerfile: apps/api-python/Dockerfile
      args:
        ATLAS_NEURAL: ${ATLAS_NEURAL:-false}
        ATLAS_STREAMING: ${ATLAS_STREAMING:-false}
        ATLAS_LAKEHOUSE: ${ATLAS_LAKEHOUSE:-false}
    environment:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas_dev_only@postgres:5432/atlas
      ATLAS_ALLOWED_ORIGINS: http://localhost:3000
      ATLAS_DEV_TOKEN: atlas-local-development-token
      ATLAS_STREAMING_ENABLED: ${ATLAS_STREAMING_ENABLED:-false}
      ATLAS_STREAMING_PROVIDER: ${ATLAS_STREAMING_PROVIDER:-sqlite}
      ATLAS_STREAMING_STORE: /var/lib/atlas/streaming.db
      ATLAS_LAKEHOUSE_ENABLED: ${ATLAS_LAKEHOUSE_ENABLED:-false}
      ATLAS_LAKEHOUSE_STORE: /var/lib/atlas/usage-lakehouse
      ATLAS_KAFKA_BOOTSTRAP: kafka:9092
      ATLAS_AIRFLOW_ENABLED: ${ATLAS_AIRFLOW_ENABLED:-false}
      ATLAS_AIRFLOW_API_URL: http://airflow:8080
      ATLAS_AIRFLOW_API_TOKEN: ${ATLAS_AIRFLOW_API_TOKEN:-}
      ATLAS_AIRFLOW_TENANT: northstar
      # Observer has USAGE only; it can read server/session metadata but no tables.
      ATLAS_MARIADB_OBSERVER_URL: mariadb+pymysql://atlas_observer:atlas_observer_dev_only@mariadb:3306/atlas_lab
      # This user is read/write only inside the derived projection database.
      ATLAS_MONGODB_PROJECTION_URL: mongodb://atlas_projection:atlas_projection_dev_only@mongodb:27017/atlas_document?authSource=atlas_document
      # Cache user can touch only atlas:cache:* with four bounded commands.
      ATLAS_REDIS_CACHE_URL: redis://atlas_cache:atlas_cache_dev_only@redis:6379/0
      ATLAS_REPOSITORY_ROOT: /workspace
      # Empty means the read-only catalog remains available while generation
      # fails closed. Supply the key through the host environment, never Git.
      ATLAS_OPENAI_API_KEY: ${ATLAS_OPENAI_API_KEY:-}
      ATLAS_AI_ECONOMY_MODEL: ${ATLAS_AI_ECONOMY_MODEL:-gpt-5.6-luna}
      ATLAS_AI_BALANCED_MODEL: ${ATLAS_AI_BALANCED_MODEL:-gpt-5.6-terra}
      ATLAS_AI_MONTHLY_BUDGET_USD: ${ATLAS_AI_MONTHLY_BUDGET_USD:-25}
      ATLAS_AI_RUN_RESERVATION_USD: ${ATLAS_AI_RUN_RESERVATION_USD:-0.25}
      ATLAS_AI_RESERVATION_TTL_SECONDS: ${ATLAS_AI_RESERVATION_TTL_SECONDS:-900}
      ATLAS_AI_SLO_AVAILABILITY_TARGET: ${ATLAS_AI_SLO_AVAILABILITY_TARGET:-0.99}
      ATLAS_AI_SLO_P95_SECONDS_TARGET: ${ATLAS_AI_SLO_P95_SECONDS_TARGET:-30}
      ATLAS_LOCAL_AI_ENABLED: ${ATLAS_LOCAL_AI_ENABLED:-false}
      ATLAS_LOCAL_AI_BASE_URL: ${ATLAS_LOCAL_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      ATLAS_LOCAL_AI_MODEL: ${ATLAS_LOCAL_AI_MODEL:-atlas-local-code-model}
      ATLAS_LOCAL_AI_API_KEY: ${ATLAS_LOCAL_AI_API_KEY:-}
    volumes: ["atlas_usage:/var/lib/atlas"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ATLAS_API_URL: http://api:8000
      ATLAS_DEV_TOKEN: atlas-local-development-token
      ATLAS_ALLOWED_ORIGINS: http://localhost:3000
      ATLAS_BROWSER_WS_URL: ws://localhost:8000/v1/realtime/ws
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  api-node:
    build:
      context: .
      dockerfile: apps/api-node/Dockerfile
    environment:
      ATLAS_API_URL: http://api:8000
      ATLAS_DEV_TOKEN: atlas-local-development-token
      ATLAS_NODE_HTTP_PORT: 8100
      ATLAS_NODE_GRPC_PORT: 8101
    ports: ["127.0.0.1:8100:8100", "127.0.0.1:8101:8101"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  atlas_usage:
  atlas_kafka:
  atlas_postgres:
  atlas_mariadb:
  atlas_mongodb:
  atlas_redis:
